nt-size:12px;line-height:1.8}.node-dialog dt{font-weight:770}.node-dialog dd{color:var(--muted)}.dialog-close{position:absolute;top:17px;right:17px;border:0;background:var(--bg);color:var(--muted);display:grid;place-items:center;border-radius:6px;width:30px;height:30px}.toast{position:fixed;z-index:200;bottom:27px;left:50%;transform:translateX(-50%);background:#1c2b40;color:#fff;padding:10px 18px;border-radius:7px;box-shadow:0 10px 30px #0002;font-size:12px;white-space:nowrap}.mobile-overlay{display:none}

<body>

  <script>
// 蓝图研习室：本地教学数据。可在接入后端后迁移为 API/内容管理系统。
window.BlueprintData = (() => {
const step = (title, place, action, why, chain, check, trouble) => ({title, place, action, why, chain, check, trouble});
const cases = [
 {id:'interaction',icon:'pointer',category:'交互',level:'入门',minutes:'35–50 分钟',title:'交互与拾取',subtitle:'一个输入事件，一条射线，一个接口，连接门、按钮和物品。',intro:'先制作可以反复验证的最小交互闭环，再让不同 Actor 响应同一个交互请求。',tags:['IA_Interact','Line Trace','Blueprint Interface'],outcome:['面对物体按 E 可以触发交互','射线未命中时不会报错','不同交互物体使用同一接口'],prereq:['已新建 Third Person 蓝图项目','知道如何打开角色蓝图'],steps:[
 step('明确交互范围','关卡与角色蓝图','在关卡摆放一个立方体作为测试目标；确定只允许玩家面向、在一定距离内的物体被交互。','先定义可验证的范围，避免后续输入和目标判定混在一起。','玩家输入 → 射线检测 → 接口调用 → 物体响应','关卡中能找到玩家和测试立方体。','如果玩家不能移动，先检查当前 GameMode 是否使用正确的 Pawn。'),
 step('创建 IA_Interact','内容浏览器 → Input 文件夹','右键创建 Input Action，命名 IA_Interact；Value Type 设为 Digital (bool)。','Input Action 只描述一种动作，不负责绑定实体按键。','IA_Interact（Digital）','能够在内容浏览器找到 IA_Interact。','旧版输入系统与 Enhanced Input 操作不同，本教程使用 Enhanced Input。'),
 step('绑定 E 键','IMC_Default / 你的 Input Mapping Context','打开已有 Mapping Context，新增 IA_Interact 的映射，按键选择 E，保存。','Mapping Context 负责把键位转换为输入动作。','E → IMC_Default → IA_Interact','运行时按 E 不应影响原有移动。','如果 E 没反应，确认当前角色已经 Add Mapping Context。'),
 step('接入角色输入事件','BP_ThirdPersonCharacter → Event Graph','右键添加 IA_Interact 事件，使用 Started 引脚作为一次按键触发点。','Started 通常每次按下触发一次，避免 Triggered 每帧重复执行。','IA_Interact.Started → 后续检测逻辑','按 E 时通过 Print String 输出「已按下 E」。','若事件无响应，检查 IA 名称和 Enhanced Input 配置。'),
 step('获取射线起点和方向','BP_ThirdPersonCharacter → Event Graph','从 FollowCamera 获取 World Location、Forward Vector。将前向向量乘以 250，再与相机位置相加作为终点。','从摄像机中心向前检测，便于玩家用镜头对准交互目标。','Start = Camera Location；End = Start + Forward × 250','画出 Debug Line 后，射线应从镜头位置向前。','注意 Vector × Float，再用 Vector + Vector；不要把世界坐标和局部坐标混用。'),
 step('执行 Line Trace','BP_ThirdPersonCharacter → Event Graph','添加 Line Trace By Channel；Start 和 End 连接上一步结果；Trace Channel 使用 Visibility；Draw Debug Type 暂设 For Duration。','只处理射线命中的对象，避免距离内的所有物体同时响应。','IA_Interact.Started → Line Trace By Channel','面对立方体按 E 时，能看到可见的调试射线。','若射线穿过物体，检查物体对 Visibility 通道是否为 Block。'),
 step('判断是否命中','BP_ThirdPersonCharacter → Event Graph','把 Line Trace 的 Return Value 接 Branch；True 时通过 Out Hit → Break Hit Result 获取 Hit Actor。','Return Value 只表示是否命中，Hit Actor 才是命中的具体对象。','Return Value → Branch(True) → Hit Actor','面对空地按 E 不再继续执行。','不要直接把 Out Hit 当成 Actor，它是 Hit Result 结构体。'),
 step('创建交互接口','内容浏览器 → Blueprints','新建 Blueprint Interface，命名 BPI_Interactable；添加函数 Interact，输入参数 Interactor，类型 Actor Object Reference。','接口能让角色与门、按钮、物品解耦，不必 Cast 到每个目标类型。','BPI_Interactable → Interact(Interactor)','接口资产可以保存，函数参数可见。','接口本身没有实现逻辑；真正的交互行为由目标蓝图实现。'),
 step('让测试物体实现接口','BP_InteractableCube → Class Settings','创建 Actor 蓝图并添加 Static Mesh；在 Class Settings → Implemented Interfaces 添加 BPI_Interactable；实现 Event Interact 并 Print String「交互成功」。','先用简单可观察的反馈验证接口是否生效。','BP_InteractableCube implements BPI_Interactable','在蓝图中能找到接口事件并输出测试文字。','实现接口后需 Compile；纯函数与事件表现形式可能不同。'),
 step('从角色发送接口消息','BP_ThirdPersonCharacter → Event Graph','在命中分支中对 Hit Actor 使用 Does Object Implement Interface；为 True 时执行 Interact (Message)，Target 接 Hit Actor，Interactor 接 Self。','先检查目标是否支持接口，再调用消息，便于排错和扩展。','Hit Actor → Does Implement Interface → Interact (Message)','面对测试立方体按 E，出现「交互成功」。','注意选择带 Message 标识的接口调用，而不是目标类自己的函数。'),
 step('验收与整理','关卡和两个蓝图','测试命中、未命中、距离外、没有接口的物体四种情况；成功后关闭射线调试显示，整理注释框。','真正完成一个系统，需要验证成功路径与失败路径。','按 E → 检测 → 命中校验 → 接口消息 → 目标执行','四个测试都通过；不应出现重复触发或运行时报错。','若可连续重复拾取，给物品加入已拾取状态或拾取后销毁逻辑。')
 ]},
 {id:'character',icon:'person',category:'人物',level:'入门',minutes:'60–90 分钟',title:'人物系统',subtitle:'从角色蓝图、移动输入到跳跃与相机，建立可扩展的玩家控制。',intro:'基于 Third Person 模板建立玩家角色系统。先保证基础功能，再增加适用于 2D 横版的分支。',tags:['Character','Enhanced Input','Spring Arm'],outcome:['WASD 移动与镜头操作正常','空格键可跳跃','人物朝向与相机行为可解释'],prereq:['已创建 UE5 Third Person 项目','项目使用 Enhanced Input'],steps:[
 step('理解角色组成','BP_ThirdPersonCharacter → Components','查看 Capsule、Mesh、CharacterMovement、CameraBoom、FollowCamera 五个常见组件，并记录它们的用途。','知道组件负责什么，才能避免把所有逻辑写进 Event Graph。','Capsule → 碰撞；Mesh → 外观；Movement → 行走；Spring Arm → 相机距离','能在 Components 中定位所有关键组件。','模板命名随版本略有差异，优先按组件类型识别。'),
 step('检查角色是否被控制','World Settings → GameMode','确认关卡使用的 GameMode，其 Default Pawn Class 指向你的 Character 蓝图。','关卡不生成正确角色，后续输入再正确也不会生效。','GameMode → Default Pawn → 玩家控制','点击 Play 后视角跟随你的角色。','检查是否放置了另一个带 Auto Possess Player 的 Pawn。'),
 step('准备移动输入动作','内容浏览器 → Input','确认 IA_Move 为 Axis2D，IA_Look 为 Axis2D，IA_Jump 为 Bool；没有则创建并保存。','二维输入值能统一承载前后与左右的移动意图。','IA_Move (Axis2D)；IA_Look (Axis2D)','三个输入动作出现在内容浏览器。','Input Action 的 Value Type 不正确会导致后面拆分轴出错。'),
 step('检查 Mapping Context','IMC_Default','把 W/S 映射到 Move 的 Y 轴，把 A/D 映射到 X 轴，检查需要的 Negate/Swizzle 修饰器；把鼠标映射到 Look、Space 映射到 Jump。','正确的轴向取决于 Mapping Context 的修饰器配置。','WASD → IA_Move；Mouse → IA_Look；Space → IA_Jump','使用输入调试或 Print String 查看方向是否符合预期。','WASD 的 X/Y 轴是否匹配可能受模板版本配置影响，请以实际调试为准。'),
 step('添加输入映射上下文','角色蓝图 → BeginPlay','获取 Player Controller → Enhanced Input Local Player Subsystem，在其中 Add Mapping Context(IMC_Default，Priority 0)。','需要激活映射，Input Action 才能接收到对应按键。','BeginPlay → Enhanced Input Subsystem → Add Mapping Context','按键事件开始有反应。','部分模板已自动添加 Mapping Context，不要重复添加不同的映射导致冲突。'),
 step('处理前后左右移动','角色蓝图 → Event Graph','IA_Move Triggered → Get Action Value(Vector2D) → Break Vector2D。使用控制器 Yaw 生成前向/右向，分别调用 Add Movement Input。','把输入方向转换成世界移动方向，保证相机转动后移动仍一致。','IA_Move → Break Vector2D → Forward/Right Vector → Add Movement Input','WASD 能独立控制四向移动。','只用 Get Actor Forward Vector 会使移动固定跟随角色自身朝向。'),
 step('添加镜头控制','角色蓝图 → Event Graph','IA_Look Triggered → Break Vector2D → Add Controller Yaw Input 与 Add Controller Pitch Input。','镜头控制与人物移动分别处理，后续更易切换视角方案。','IA_Look → Yaw / Pitch','鼠标移动时镜头可上下左右转动。','输入被 UI 捕获时，检查 Set Input Mode 与鼠标光标设置。'),
 step('处理跳跃','角色蓝图 → Event Graph','IA_Jump Started → Jump；IA_Jump Completed → Stop Jumping。','按下起跳、松开结束输入，适配 Character 的默认跳跃能力。','IA_Jump.Started → Jump；Completed → Stop Jumping','Space 可以起跳，角色落地恢复。','检查 CharacterMovement 是否允许跳跃，角色是否落在有碰撞的地面。'),
 step('控制人物面向','Character 属性与 CharacterMovement','第三人称常见设置：取消 Use Controller Rotation Yaw，开启 Orient Rotation to Movement；测试转向速度。','让人物朝向运动方向，而不是始终按镜头朝向强制旋转。','Move Direction → CharacterMovement Rotation','左右移动时人物平滑转向。','开启 Use Controller Rotation Yaw 可能与 Orient Rotation to Movement 互相冲突。'),
 step('调节相机距离','CameraBoom / FollowCamera 属性','修改 Target Arm Length 与 Socket Offset；测试 Camera Collision 的 Probe Size 和 Do Collision Test。','用 Spring Arm 管理视角和遮挡，尽量少用手动 Tick 更新位置。','CameraBoom → FollowCamera','近墙时相机不会严重穿模；不会频繁突然拉近。','如果碰撞让相机不断缩放，排查自定义 Mesh 的碰撞响应。'),
 step('整理蓝图结构','角色蓝图 → Event Graph','按输入、移动、镜头、跳跃划分注释框；为较长逻辑建立函数，避免复制多组节点。','让以后添加攻击、生命值、交互系统更容易维护。','Input / Movement / Camera / Jump','能向另一位初学者解释每块逻辑的入口。','不要把需要潜在异步行为的节点随意搬进 Blueprint Function。'),
 step('完整功能验收','PIE / 独立窗口测试','顺序测试移动、旋转、跳跃、碰撞、相机，并观察 Output Log 是否出现错误。','在一个模块稳定后再扩展，能显著减少联动问题。','角色生成 → 接收输入 → 移动 → 镜头 → 跳跃','基础三维人物控制完成。','常见问题集中在 GameMode、Mapping Context、CharacterMovement 和碰撞。')
 ],branch:[
 step('启用横版运动约束','CharacterMovement → Planar Movement','根据关卡坐标选择正确的平面约束轴；开启 Constrain to Plane，并设置 Plane Constraint Axis Setting。','2D 横版角色通常只允许在一个平面内移动。','Input Axis → Planar Movement','角色不能离开横版运动平面。','切勿在未确认世界朝向时固定写死 X/Y，先用关卡坐标轴确认。'),
 step('固定侧视相机','CameraBoom / Camera','将相机朝向侧面，必要时停用 Pawn Control Rotation，并配置正交投影或固定透视视角。','减少玩家手动转镜头造成的横版视角偏移。','Fixed Camera → Side View','相机始终看到角色侧面。','正交投影的 Ortho Width 决定可见范围；先用基础值小步调整。'),
 step('改为左右移动','IA_Move / 角色蓝图','只取代表左右的输入轴，并沿关卡横向轴调用 Add Movement Input；去掉不需要的镜头方向换算。','横版角色的移动方向一般由关卡平面定义。','IA_Move → Horizontal Value → Add Movement Input','A/D 可以左右移动且不会前后漂移。','轴向与关卡坐标需要匹配；可以先打印轴值。'),
 step('验收像素角色','PIE → 测试关卡','测试左右移动、跳跃、面对方向和摄像机跟随，观察 Sprite/Flipbook 是否翻转正确。','让 2D 项目仍能复用人物系统的核心输入和状态结构。','Move → Face Direction → Animate','完成适用于 2D 横版的基础控制。','Paper2D Sprite 与 Skeletal Mesh 的动画方式不同，不能直接照搬动画蓝图。')
 ]},
 {id:'ai',icon:'brain',category:'AI',level:'进阶',minutes:'50–70 分钟',title:'AI 巡逻 → 追击 → 攻击',subtitle:'通过黑板键与优先级，解决攻击时还在巡逻的问题。',intro:'用最简单的 AIController、Blackboard、Behavior Tree 分离感知与执行。',tags:['Blackboard','Behavior Tree','AI Perception'],outcome:['AI 能沿点位巡逻','发现玩家后切换追击','攻击优先级高于巡逻'],prereq:['已了解 Pawn/Character','场景有 Nav Mesh Bounds Volume'],steps:[
 step('建立 AI 角色','Content Browser','创建 BP_EnemyCharacter 和 BP_EnemyAIController；在敌人的 AI Controller Class 中设置控制器，Auto Possess AI 设为 Placed in World or Spawned。','让敌人拥有可运行的 AI 控制器。','Enemy Character → AI Controller','Play 时敌人由 AI 控制器接管。','检查敌人是否放在导航网格之内。'),
 step('建立黑板键','Blackboard','建立 BB_Enemy，添加 TargetActor (Object, Actor)、PatrolLocation(Vector) 和 InAttackRange(Bool)。','黑板用于在不同任务之间共享状态。','Blackboard Keys → Decision Data','黑板键和类型正确。','Actor 引用与 Vector 位置不应混用。'),
 step('创建行为树','Behavior Tree','创建 BT_Enemy，选中 Blackboard Asset 为 BB_Enemy，建立 Root 下的 Selector。','Selector 按优先级挑选可执行分支。','Root → Selector','BT 可以正常保存和打开。','没有选择黑板时，Decorator 可能找不到键。'),
 step('配置追击分支','BT_Enemy','在高优先级分支添加 TargetActor Is Set 条件，再放 Move To(TargetActor)。','玩家存在时优先追击，而不是继续巡逻。','Selector → Chase(TargetActor Is Set) → Move To','赋值 TargetActor 后 AI 朝玩家移动。','检查导航网格显示（P 键）与 Move To 的目标类型。'),
 step('加入攻击条件','BT_Enemy','在追击分支之上建立攻击分支，要求 TargetActor Is Set 且 InAttackRange 为 True，然后执行攻击 Task。','攻击分支优先级应高于追击与巡逻。','Selector → Attack → Chase → Patrol','攻击距离内优先执行攻击。','Decorator 的 Observer Aborts 推荐按逻辑设置，以打断低优先级巡逻任务。'),
 step('处理攻击朝向','攻击 Task / 敌人角色','执行攻击前获取目标位置，计算 Look At Rotation，通常只保留 Yaw 转向；必要时用插值平滑旋转。','确保动画和实际攻击方向相符。','Target Location → Find Look at Rotation → Yaw','攻击前敌人面向玩家。','如果 CharacterMovement 控制了旋转，需统一旋转方案避免被覆盖。'),
 step('补充巡逻任务','BT_Enemy','巡逻分支选择 PatrolLocation，然后 Move To；到达后通过 Task 更新巡逻点。','只有不存在更高优先级任务时才巡逻。','Selector → Patrol Move To','没有玩家时可持续巡逻。','目标点不在 NavMesh 时 Move To 会失败。'),
 step('验证分支切换','Behavior Tree Debugger','分别测试无玩家、发现玩家、进入攻击距离、玩家离开这四种状态，查看当前高亮 Task。','用行为树调试器定位是否是状态、条件或移动问题。','Patrol ⇄ Chase ⇄ Attack','四种状态切换符合预期。','出现“边打边巡逻”时优先检查分支优先级和 Observer Aborts。')
 ]},
 {id:'inventory',icon:'grid',category:'背包',level:'入门',minutes:'45–65 分钟',title:'简单背包系统',subtitle:'从数据结构开始，完成放入、堆叠、使用与容量判断。',intro:'先用数据模拟背包逻辑，再接 UI；不要把物品行为全部写死在 Widget。',tags:['Struct','Array','UMG'],outcome:['可以存放物品','相同物品按上限堆叠','背包满时拒绝新增'],prereq:['已能新建 Blueprint Struct','掌握基本变量与数组'],steps:[
 step('定义物品数据','Content Browser → Blueprints','创建 S_ItemStack，包含 ItemID(Name)、Count(Integer)、MaxStack(Integer) 和 Icon(Texture2D Reference)。','用稳定 ItemID 区分物品，数量单独保存。','ItemStack = ID + Count + MaxStack + Icon','结构体能保存并在变量类型中使用。','不要只依赖显示名称判断物品是否相同。'),
 step('建立背包组件','Actor Component','创建 BP_InventoryComponent，增加 Items（S_ItemStack Array）与 MaxSlots（Integer）。','把背包数据从 UI 和角色表现中分离。','Character → InventoryComponent','组件可以添加到角色。','MaxSlots 指槽位数，不是每类物品堆叠上限。'),
 step('编写添加入口','BP_InventoryComponent → Functions','建立 AddItem，输入 ItemID、Amount，返回 AddedAmount 与 RemainingAmount。','用实际写入量描述结果，支持部分成功的情况。','AddItem(ID, Amount) → Added / Remaining','函数参数和返回值完整。','不同物品可能有不同 MaxStack，需从定义数据查到真实上限。'),
 step('先向现有堆叠补充','AddItem Function','循环 Items，匹配 ItemID 且 Count < MaxStack 的槽位，计算可加入的数量并更新该槽位。','最大化利用已占用的背包槽位。','Existing Stack → Free Space → Insert','已有 7/10 的物品再加入 5 个，结果应为 10/10 和剩余 2。','修改结构体数组元素后确认写回数组，不能只修改临时副本。'),
 step('创建新堆叠','AddItem Function','若仍有剩余且 Items.Length < MaxSlots，则按 MaxStack 分批添加新结构体。','剩余物品进入空槽，容量满时停止。','Remaining > 0 && Free Slot → Add Stack','空槽足够时可以生成新的堆叠。','剩余数量可能大于单槽上限，不能一次性塞入。'),
 step('绑定 UI 列表','Widget Blueprint','创建 WBP_Inventory，根据 Items 数组生成每个槽位的显示，并在数据变化时刷新。','Widget 负责呈现，不负责决定能否存入。','Inventory Data → Widget Render','图标、数量与槽位个数对应。','频繁 Tick 刷新 UI 性能较差，优先事件驱动更新。'),
 step('边界测试','PIE / 测试物品','测试 0 个、恰好填满、超出堆叠上限、背包槽位满和不同 ItemID 的行为。','容量和堆叠最容易出错的就是极端输入。','Valid Input → AddItem → Report Remaining','满槽不会丢失数据，无法加入的数量被正确返回。','注意禁止负数 Amount；避免 Count 超上限。')
 ]},
 {id:'health',icon:'heart',category:'战斗',level:'入门',minutes:'30–45 分钟',title:'血量与受击反馈',subtitle:'把伤害扣血、死亡判断、UI 更新连接成完整闭环。',intro:'先让生命值数据准确，再处理表现与 Widget。',tags:['Apply Damage','Event AnyDamage','UMG'],outcome:['受伤后生命值减少','生命值不会低于零','死亡只触发一次'],prereq:['已经有玩家 Character'],steps:[
 step('创建血量变量','Character Blueprint','增加 MaxHealth(Float)=100 与 CurrentHealth(Float)=100，BeginPlay 时初始化。','最大血量与当前血量分开，才能处理损伤和恢复。','MaxHealth → CurrentHealth','角色生成时显示 100/100。','确保只在合适时机初始化，避免受伤时重置。'),
 step('响应伤害事件','Character Event Graph','添加 Event AnyDamage，将 CurrentHealth 减去 Damage，并 Clamp 到 0..MaxHealth。','避免生命值出现负数或超过上限。','AnyDamage → Subtract → Clamp → Set Health','Apply Damage(20) 后生命值为 80。','Damage 是否会触发取决于 Actor 的伤害相关设置与调用目标。'),
 step('执行死亡判断','Character Blueprint','更新血量后判断 CurrentHealth <= 0 且 bIsDead 为 False；设置 bIsDead=True 并执行死亡逻辑。','布尔锁保证死亡不会被重复执行。','Health <= 0 && !IsDead → Die','连续受伤时死亡事件只执行一次。','别在每次受伤时无条件调用 Die。'),
 step('建立血条 Widget','WBP_PlayerHealth','创建 Progress Bar；从角色或组件获取当前血量及最大血量，计算 CurrentHealth / MaxHealth。','Progress Bar Percent 使用 0 到 1 的比例值。','Current / Max → Set Percent','受伤后进度条同步变小。','检查 MaxHealth 不为零，优先用事件或委托刷新。'),
 step('加入受击提示','角色受伤事件','在有效受伤时执行一次受击表现，例如闪白材质或动画播放。','逻辑判断与视觉反馈分离。','AnyDamage → Health Update → Hit Feedback','无伤害输入不触发错误提示。','不要让每次 Tick 都触发闪烁。'),
 step('验证完整流程','测试关卡','连续输入不同伤害量，测试小伤害、刚好致死、溢出伤害与死亡后再次受伤。','确保边界测试覆盖所有关键状态。','受伤 → 扣血 → 更新 UI → 死亡判断','所有测试通过，无重复死亡或血量超界。','死亡后是否还接受伤害需根据设计明确处理。')
 ]},
 {id:'combo',icon:'sword',category:'战斗',level:'进阶',minutes:'60–90 分钟',title:'第三人称近战连击',subtitle:'输入缓冲配合动画窗口，完成可控的三段攻击。',intro:'使用简单状态和 Montage Notify 搭建基础连击逻辑。',tags:['Montage','Anim Notify','Input Buffer'],outcome:['攻击输入可触发第一段','窗口内输入可衔接下一段','窗口外输入不会乱跳段'],prereq:['角色可以移动','有可用于测试的攻击 Montage'],steps:[
 step('准备动作与状态','Character / Animation','创建攻击 Montage，设置 bIsAttacking、ComboIndex（0..2）和 bInputBuffered。','输入逻辑与播放状态要分开。','Attack Input → State Check','可看到相关状态变量。','没有真实动画资产时用自制测试动画替代。'),
 step('触发首次攻击','角色 Event Graph','攻击输入时，如果 !bIsAttacking 则设为 True、ComboIndex=0、播放第一段 Montage。','阻止重复输入不断重启同一动画。','IA_Attack → Branch → Play Montage','第一次按键能启动攻击。','若 Montage 无播放，请确认 Anim Instance 和 Slot 配置。'),
 step('记录缓冲输入','角色 Event Graph','攻击期间输入不立即跳段，而是设 bInputBuffered=True。','连击窗口打开前暂存玩家意图。','While Attacking → Buffered=True','连点时不会立即乱切动画。','输入缓冲需要在合适时机清空。'),
 step('设置连击窗口','Montage → Anim Notify','在攻击动画上配置可衔接点的 Notify/Notify State，触发时检查 bInputBuffered。','动画决定何时允许衔接动作。','Notify → Check Buffered → Next Section','窗口内输入可以进入下一段。','确认 Notify 在正确的 Montage 时间点触发。'),
 step('结束与重置','Montage End / Blend Out','动画完成或被中断时重置攻击状态；第三段结束后清空 ComboIndex 和缓冲。','避免攻击状态卡死。','Montage End → Reset State','攻击后可继续移动并再次出招。','中断事件与正常完成都应考虑。')
 ]},
 {id:'lockon',icon:'target',category:'战斗',level:'进阶',minutes:'55–75 分钟',title:'锁定目标与翻滚',subtitle:'将目标选择、镜头控制与闪避状态拆分管理。',intro:'适合练习射线/重叠检测、状态切换和 CharacterMovement。',tags:['Target Actor','Camera','Dodge'],outcome:['可以切换锁定目标','锁定时镜头朝向目标','翻滚不会永久阻塞输入'],prereq:['已有基础角色移动'],steps:[
 step('建立锁定状态','Character Blueprint','添加 bIsLockedOn 与 LockedTarget(Actor Reference)；输入切换时更新状态。','将目标引用与是否锁定分开。','Lock Input → Target State','锁定状态能打印和切换。','目标销毁后需要清除引用。'),
 step('筛选候选目标','角色附近 / Gameplay','在一定距离内查找带指定 Tag 或接口的目标，按屏幕中心角度与距离筛选。','锁定应该选玩家当前最有可能关注的目标。','Candidates → Filter → Pick Best','可选择最近且合理的目标。','避免对所有 Actor 每帧做高成本遍历。'),
 step('处理锁定镜头','Camera Logic','锁定后根据目标位置求 Look At Rotation，合理插值镜头朝向，退出时恢复常规视角。','减少镜头瞬间跳变。','Target Position → LookAt → RInterp','镜头平滑朝向目标。','角色旋转与控制器旋转不能互相打架。'),
 step('实现翻滚','Character / Input','建立 bIsDodging；满足条件时播放翻滚动画并应用位移方案，结束时复位。','翻滚是独立状态，不应该被锁定本身覆盖。','Dodge Input → Can Dodge → Dodge State','连续输入时不会重复播放错误。','动画位移与物理移动方案需统一。'),
 step('测试状态组合','PIE','测试未锁定翻滚、锁定翻滚、目标死亡、锁定中移动、翻滚结束恢复。','组合状态测试可暴露相互覆盖的问题。','Move × LockOn × Dodge','不会卡在无法移动或无法转镜头的状态。','异常大多来自多个蓝图同时修改旋转或移动参数。')
 ]}
];

 <div class="lesson-progress"><div><strong>完成进度</strong><span>${all} / ${stepsTotal(c)} 步</span></div><div class="meter"><span style="width:${percentage(all,stepsTotal(c))}%"></span></div></div>
 <div class="lesson-layout"><aside class="lesson-nav"><div class="lesson-sidebar-heading">学习章节 <span>${c.steps.length} 步</span></div><div class="lesson-nav-items">${c.steps.map((ss,i)=>`<button class="lesson-step ${!state.caseBranch&&curIndex===i?'current':''} ${complete(c.id,i)?'finished':''}" data-action="lesson-index" data-i="${i}" data-branch="false"><span class="step-indicator">${complete(c.id,i)?svg('check',14):String(i+1).padStart(2,'0')}</span><span>${esc(ss.title)}</span></button>`).join('')}</div>${c.branch?.length?`<div class="lesson-sidebar-heading branch-heading">2D 横版专项 <span>${c.branch.length} 步</span></div><div class="lesson-nav-items">${c.branch.map((ss,i)=>`<button class="lesson-step ${state.caseBranch&&curIndex===i?'current':''} ${complete(c.id,i,true)?'finished':''}" data-action="lesson-index" data-i="${i}" data-branch="true"><span class="step-indicator">${complete(c.id,i,true)?svg('check',14):String(i+1).padStart(2,'0')}</span><span>${esc(ss.title)}</span></button>`).join('')}</div>`:''}</aside>
 <article class="lesson-article"><div class="lesson-article-top"><span class="step-counter">${state.caseBranch?'横版专项 / ':''}第 ${curIndex+1} 步 · 共 ${steps.length} 步</span><button class="bookmark-btn ${fav(c.id)?'bookmarked':''}" data-action="favorite" data-id="${c.id}" aria-label="${fav(c.id)?'取消收藏':'收藏教程'}">${svg('bookmark',18)} ${fav(c.id)?'已收藏':'收藏'}</button></div><h2>${esc(s.title)}</h2><div class="guide-block"><div class="guide-heading">${svg('target',17)} 在哪里操作</div><p>${esc(s.place)}</p></div><div class="guide-block"><div class="guide-heading">${svg('checkcircle',17)} 具体怎么做</div><p>${esc(s.action)}</p></div><div class="guide-block subtle-block"><div class="guide-heading">${svg('light',17)} 为什么这么做</div><p>${esc(s.why)}</p></div><div class="flow-title">逻辑连接示意 <span>仅用于理解执行顺序</span></div><div class="flow-preview"><div class="flow-label">BLUEPRINT FLOW</div>${flowMarkup(s.chain)}<button class="flow-copy" data-copy="${esc(s.chain)}" title="复制连接说明">${svg('copy',16)}</button></div><div class="check-panel"><div class="guide-heading">${svg('checkcircle',17)} 本步验收</div><p>${esc(s.check)}</p><button class="button ${done?'success':'primary'}" data-action="complete-step" data-id="${c.id}" data-i="${curIndex}" data-branch="${state.caseBranch}">${svg(done?'check':'circle',17)} ${done?'已完成 · 点击取消':'我已完成这一步'}</button></div><details class="error-details"><summary>${svg('alert',18)} 遇到问题？查看排错提示 ${svg('right',16)}</summary><p>${esc(s.trouble)}</p></details><div class="lesson-navigation"><button class="button secondary" data-action="prev-step" ${curIndex===0?'disabled':''}>${svg('left',16)} 上一步</button><button class="button primary" data-action="next-step" ${curIndex===steps.length-1?'disabled':''}>下一步 ${svg('right',16)}</button></div></article>
 <aside class="lesson-right"><div class="right-widget"><span class="widget-label">本课目标</span>${c.outcome.map(t=>`<div class="goal-item">${svg('checkcircle',15)} <span>${esc(t)}</span></div>`).join('')}</div><div class="right-widget"><span class="widget-label">开始前请确认</span>${c.prereq.map(t=>`<div class="goal-item">${svg('circle',14)} <span>${esc(t)}</span></div>`).join('')}</div><div class="right-widget"><div class="widget-label">我的学习笔记</div><label for="lessonNote" class="sr-only">学习笔记</label><textarea id="lessonNote" class="note-area" placeholder="记下节点名、错误和解决办法…">${esc(store.notes[c.id]||'')}</textarea><div class="note-foot">自动保存在当前浏览器</div></div></aside></div></div>`;}
function nodesPage(){const groups=['全部',...new Set(nodes.map(n=>n.group))];const q=state.nodeQuery.toLowerCase();const list=nodes.filter(n=>(state.nodeGroup==='全部'||state.nodeGroup===n.group)&&(`${n.name} ${n.summary} ${n.group}`.toLowerCase().includes(q)));return `<div class="container page-content">${sectionHeader('NODE REFERENCE','蓝图节点词典','快速查找节点作用、输入输出引脚、使用场景和容易踩的坑。')}<div class="library-toolbar"><label class="inline-search">${svg('search',17)}<input id="nodeSearch" placeholder="搜索 Branch / Line Trace / 节点用途" value="${esc(state.nodeQuery)}" /></label><span>${list.length} 个节点</span></div><div class="filter-row">${groups.map(g=>`<button data-nodegroup="${esc(g)}" class="filter-button ${state.nodeGroup===g?'selected':''}">${esc(g)}</button>`).join('')}</div><div class="nodes-grid">${list.map(n=>`<button class="node-item" data-node="${esc(n.name)}"><div class="node-label"><span class="node-badge">${svg('nodes',17)}</span><span class="pill">${esc(n.group)}</span></div><strong>${esc(n.name)}</strong><p>${esc(n.summary)}</p><span class="node-more">查看详细说明 ${svg('arrow',15)}</span></button>`).join('')}</div>${list.length?'':`<div class="empty-state">未找到相关节点。</div>`}</div>`;}
function breakdownPage(){return `<div class="container page-content">${sectionHeader('GAME SYSTEM ANALYSIS','游戏机制拆解','把玩家可见的功能转成程序能执行的规则、条件与测试用例。')}<div class="breakdown-hero"><div class="eyebrow">PORTFOLIO CASE STUDY / 功能拆解</div><h2>《三角洲行动》<br>烽火地带 · 仓库系统</h2><p>聚焦纯功能、纯规则和纯交互：格子、存放、堆叠、整理、扩容与装备转移。不涉及商业游戏资产或源码。</p><div class="breakdown-tags"><span>界面规则</span><span>交互流程</span><span>异常条件</span><span>验收思路</span></div></div><div class="breakdown-grid">${breakdown.map((b,i)=>`<article class="breakdown-card"><div class="break-num">模块 ${String(i+1).padStart(2,'0')}</div><h3>${esc(b.title)}</h3><p>${esc(b.subtitle)}</p><ul>${b.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></article>`).join('')}</div><div class="bottom-note">${svg('info',19)} <span>这是学习版规则检查卡，不等同于原游戏官方技术文档，也不是对原项目全部细节的还原。</span></div></div>`;}
function trainingPage(){const n=allDone(),total=totalSteps(),favorites=cases.filter(c=>fav(c.id));return `<div class="container page-content">${sectionHeader('PERSONAL WORKSPACE','我的训练','继续上次的练习，查看每套系统的学习记录，并备份本地数据。')}<div class="training-summary"><div><span>累计完成</span><strong>${n} <small>/ ${total} 步</small></strong><div class="meter"><span style="width:${percentage(n,total)}%"></span></div></div><div><span>已完成整套系统</span><strong>${cases.filter(c=>countCase(c)===stepsTotal(c)).length} <small>/ ${cases.length} 套</small></strong></div><div><span>已收藏</span><strong>${favorites.length} <small>套课程</small></strong></div></div><div class="training-section"><div class="training-section-head"><h3>案例进度</h3><p>继续学习会回到该案例上次阅读的步骤。</p></div><div class="training-cases">${cases.map(c=>`<button class="training-case" data-go="case" data-id="${c.id}"><span class="train-icon">${svg(c.icon,19)}</span><span class="train-info"><strong>${esc(c.title)}</strong><div class="meter"><span style="width:${percentage(countCase(c),stepsTotal(c))}%"></span></div></span><span class="train-count">${countCase(c)} / ${stepsTotal(c)}</span>${svg('right',16)}</button>`).join('')}</div></div><div class="training-section"><div class="training-section-head"><h3>学习记录备份</h3><p>数据仅存于此浏览器。清除浏览器数据会丢失记录，建议定期导出备份。</p></div><div class="backup-actions"><button class="button primary" data-action="export">${svg('download',17)} 导出学习记录</button><button class="button secondary" data-action="import">${svg('upload',17)} 导入备份文件</button><input id="backupFile" hidden type="file" accept=".json,application/json" /></div></div>${favorites.length?`<div class="training-section"><div class="training-section-head"><h3>我的收藏</h3></div><div class="favorites-list">${favorites.map(c=>`<button data-go="case" data-id="${c.id}">${svg('bookmark',16)} ${esc(c.title)} ${svg('right',15)}</button>`).join('')}</div></div>`:''}</div>`;}
function renderDialog(){if(state.dialog==='search'){return `<div class="dialog-wrap" role="presentation" data-action="close-dialog"><div class="search-dialog" role="dialog" aria-modal="true" aria-label="全局搜索"><label class="dialog-search">${svg('search',20)}<input id="globalSearch" placeholder="查找案例、蓝图节点或操作方法…" autocomplete="off" /><kbd>ESC</kbd></label><div class="dialog-results" id="globalResults"></div><div class="dialog-footer">输入关键词搜索 · 点击结果跳转 <span>Esc 关闭</span></div></div></div>`;}
if(state.dialog==='node'){const node=nodes.find(n=>n.name===state.nodeName);if(!node)return '';return `<div class="dialog-wrap" role="presentation" data-action="close-dialog"><div class="node-dialog" role="dialog" aria-modal="true" aria-label="${esc(node.name)} 节点说明"><button class="dialog-close" data-action="close-dialog" aria-label="关闭">${svg('x',19)}</button><span class="pill">${esc(node.group)} / ${esc(node.kind)}</span><h2>${esc(node.name)}</h2><p>${esc(node.summary)}</p><dl><dt>输入引脚</dt><dd>${esc(node.inputs)}</dd><dt>输出引脚</dt><dd>${esc(node.outputs)}</dd><dt>使用场景</dt><dd>${esc(node.example)}</dd><dt>容易踩的坑</dt><dd>${esc(node.pitfall)}</dd></dl></div></div>`;}return '';}
function updateSearchResults(q){const normalized=q.trim().toLowerCase();const matchedCases=normalized?cases.filter(c=>(c.title+c.subtitle+c.tags.join('')).toLowerCase().includes(normalized)):cases.slice(0,4);const matchedNodes=normalized?nodes.filter(n=>(n.name+n.summary+n.group).toLowerCase().includes(normalized)):nodes.slice(0,4);const box=$('#globalResults');if(!box)return;box.innerHTML=`<div class="dialog-group">系统案例</div>${matchedCases.map(c=>`<button class="dialog-result" data-go="case" data-id="${c.id}">${svg(c.icon,18)}<span><strong>${esc(c.title)}</strong><small>${esc(c.subtitle)}</small></span>${svg('right',16)}</button>`).join('')||'<div class="dialog-empty">暂无匹配案例</div>'}<div class="dialog-group">蓝图节点</div>${matchedNodes.map(n=>`<button class="dialog-result" data-node="${esc(n.name)}">${svg('nodes',18)}<span><strong>${esc(n.name)}</strong><small>${esc(n.summary)}</small></span>${svg('right',16)}</button>`).join('')||'<div class="dialog-empty">暂无匹配节点</div>'}`;}
function render(){const pages={dashboard,cases:casesPage,case:casePage,nodes:nodesPage,breakdown:breakdownPage,training:trainingPage};document.documentElement.dataset.theme=store.theme;document.getElementById('app').innerHTML=shell((pages[state.route]||dashboard)());if(state.dialog==='search'){updateSearchResults('');$('#globalSearch')?.focus();}if(state.drawer)$('#app .site-shell')?.classList.add('drawer-open');}
const notify=(msg)=>{document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2300);};
function handleClick(e){const el=e.target.closest('[data-action],[data-go],[data-filter],[data-nodegroup],[data-node],[data-copy]');if(!el)return;
 if(el.dataset.go){if(state.route==='case'&&el.dataset.go==='case'&&state.caseId!==el.dataset.id)state.caseBranch=false;go(el.dataset.go,el.dataset.id);return;}
 if(el.dataset.filter){state.filter=el.dataset.filter;render();$('#caseSearch')?.focus();return;}
 if(el.dataset.nodegroup){state.nodeGroup=el.dataset.nodegroup;render();return;}
 if(el.dataset.node){state.dialog='node';state.nodeName=el.dataset.node;render();return;}
 if(el.dataset.copy){navigator.clipboard?.writeText(el.dataset.copy).then(()=>notify('已复制节点顺序')).catch(()=>notify('当前环境不允许复制'));return;}
 const action=el.dataset.action;
 if(action==='drawer'){state.drawer=true;$('.site-shell')?.classList.add('drawer-open');return;}
 if(action==='close-drawer'){state.drawer=false;$('.site-shell')?.classList.remove('drawer-open');return;}
 if(action==='toggle-theme'){store.theme=store.theme==='light'?'dark':'light';save();render();return;}
 if(action==='search'){state.dialog='search';render();return;}
 if(action==='close-dialog'){if(el.classList.contains('dialog-wrap')&&e.target!==el)return;state.dialog=null;render();return;}
 if(action==='favorite'){const id=el.dataset.id;store.favorites=fav(id)?store.favorites.filter(x=>x!==id):[...store.favorites,id];save();render();notify(fav(id)?'已加入收藏':'已取消收藏');return;}
 if(action==='lesson-index'){const c=caseById(state.caseId);if(!c)return;state.caseBranch=el.dataset.branch==='true';const branch=state.caseBranch;const i=Number(el.dataset.i);store.last[branch?`${c.id}:branch`:c.id]=i;store.recent=[c.id,...(store.recent||[]).filter(x=>x!==c.id)].slice(0,20);save();render();window.scrollTo({top:0,behavior:'smooth'});return;}
 if(action==='complete-step'){const id=el.dataset.id,i=Number(el.dataset.i),branch=el.dataset.branch==='true';const key=`${id}:${branch?'b':''}${i}`;store.done[key]=!store.done[key];save();render();notify(store.done[key]?'这一步已完成':'已取消完成标记');return;}
 if(action==='prev-step'||action==='next-step'){const c=caseById(state.caseId),key=state.caseBranch?`${c.id}:branch`:c.id;const max=(state.caseBranch?c.branch:c.steps).length-1;const i=Number(store.last[key]||0)+(action==='next-step'?1:-1);if(i<0||i>max)return;store.last[key]=i;store.recent=[c.id,...(store.recent||[]).filter(x=>x!==c.id)].slice(0,20);save();render();window.scrollTo({top:0,behavior:'smooth'});return;}
 if(action==='reset-case-search'){state.query='';state.filter='全部';render();return;}
 if(action==='export'){const blob=new Blob([JSON.stringify({product:'blueprint-lab-v2',exportedAt:new Date().toISOString(),data:store},null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`blueprint-lab-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('学习记录已导出');return;}
 if(action==='import'){$('#backupFile')?.click();return;}
}
function handleInput(e){if(e.target.id==='caseSearch'){state.query=e.target.value;const pos=e.target.selectionStart;render();const input=$('#caseSearch');input?.focus();input?.setSelectionRange(pos,pos);return;}
 if(e.target.id==='nodeSearch'){state.nodeQuery=e.target.value;const pos=e.target.selectionStart;render();const input=$('#nodeSearch');input?.focus();input?.setSelectionRange(pos,pos);return;}
 if(e.target.id==='globalSearch'){updateSearchResults(e.target.value);return;}
 if(e.target.id==='lessonNote'){store.notes[state.caseId]=e.target.value;save();return;}}
async function handleFile(e){if(e.target.id!=='backupFile'||!e.target.files?.[0])return;try{const text=await e.target.files[0].text();const parsed=JSON.parse(text);if(parsed.product!=='blueprint-lab-v2'||!parsed.data||typeof parsed.data!=='object')throw new Error('文件格式不匹配');const d=parsed.data;if(!d.done||typeof d.done!=='object'||!d.last||typeof d.last!=='object'||!d.notes||typeof d.notes!=='object'||!Array.isArray(d.favorites))throw new Error('缺少必要字段');store={...defaultStore(),...d,theme:d.theme==='dark'?'dark':'light'};save();render();notify('学习记录已恢复');}catch(err){notify('导入失败：'+err.message);}}
document.addEventListener('click',handleClick);document.addEventListener('input',handleInput);document.addEventListener('change',handleFile);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();state.dialog='search';render();}if(e.key==='Escape'&&state.dialog){state.dialog=null;render();}if(e.key==='Escape'&&state.drawer){state.drawer=false;$('.site-shell')?.classList.remove('drawer-open');}});
window.addEventListener('hashchange',parseHash);
if(!location.hash){try{history.replaceState(null,'',location.pathname+location.search+'#/dashboard');}catch(e){/* opaque origin preview: render default route */}}
parseHash();
})();

</script>
</body>
</html>
